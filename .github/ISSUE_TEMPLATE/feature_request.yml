name: 功能建议
description: 想要的新功能 / 改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议！请说明**使用场景**，这样更容易判断值不值得做。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的使用场景 / 痛点
      placeholder: 比如接单时想按客户区分项目、想导出更正式的账单……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的功能
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 有没有考虑过替代方案
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: 你觉得优先级
      options:
        - 有更好，没有也能用
        - 比较需要
        - 很需要
    validations:
      required: false
